<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue Tracker</title><meta name="theme-color" content="#166b55"><meta name="description" content="Offline queue tracker"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}body{max-width:780px;margin:auto;padding:16px}header,.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,section{border:1px solid #8885;border-radius:12px;padding:14px;margin:12px 0}.big{font-size:30px;font-weight:750}small,.muted{opacity:.7}input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #8888}button{cursor:pointer}button.primary{background:#166b55;color:white;border-color:#166b55}input[type=number]{width:85px}.liveclock{display:inline-flex;align-items:center;gap:8px;border:1px solid #8885;border-radius:9px;padding:7px 11px;margin:0 0 12px;font-variant-numeric:tabular-nums}.liveclock strong{font-size:20px}.liveclock small{font-size:12px}.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #8884}th{font-size:13px}details>summary{cursor:pointer;font-weight:650;padding:8px}#msg{min-height:1.4em;color:#166b55}.estimated{font-style:italic}dialog{border-radius:14px;border:1px solid #8888;max-width:95vw}dialog label{display:block;margin:10px 0}dialog input,dialog select{max-width:100%}@media(max-width:440px){.big{font-size:25px}.card{padding:9px}.cards{gap:5px}td,th{font-size:13px}}</style></head><body><header><div><h1>Queue Tracker</h1><small>3 counters · priority U tickets · automatic local saving</small></div><strong id="current">P120</strong></header><div class="cards"><div class="card"><small>Your ticket</small><div><input type="number" aria-label="Your P ticket" id="target" value="159" min="1"></div></div><div class="card"><small>Latest P</small><div class="big" id="last">120</div></div><div class="card"><small>Remaining</small><div class="big" id="remaining">39</div></div></div><section><small>Estimated call time</small><div class="big" id="eta">—</div><div id="estimateDetail" class="muted"></div><small>Estimate based on P ticket progression, not the number of people served.</small></section><section><h3>Add a call</h3><div class="liveclock" aria-live="off"><small>Local time</small><strong id="liveTime">--:--</strong></div><form id="addForm" class="form"><input id="number" placeholder="121 2 / U29 3" required aria-label="Ticket and counter"><input id="time" placeholder="Time (auto)" aria-label="Time (optional)" style="width:90px"><select id="station" aria-label="Counter"><option value="—">—</option><option>1</option><option>2</option><option>3</option></select><button class="primary">Add</button></form><div id="msg" role="status"></div></section><section><div class="flex"><h3>History (<span id="count"></span>)</h3><button id="export" class="primary">Copy history</button></div><div class="flex"><button id="download">Download JSON backup</button><label>Import JSON <input type="file" id="import" accept="application/json,.json" style="max-width:175px"></label></div><details id="history"><summary>Expand history</summary><div class="flex" style="margin:12px 0"><label>Sort by <select id="sort"><option value="timeDesc">Time ↓</option><option value="timeAsc">Time ↑</option><option value="numDesc">Ticket ↓</option><option value="numAsc">Ticket ↑</option></select></label><label><input type="checkbox" id="showU" checked> Show U</label></div><table><thead><tr><th>Ticket</th><th>Time</th><th>Counter</th><th></th></tr></thead><tbody id="tbody"></tbody></table></details></section><dialog id="editor"><form id="editForm"><h3>Edit entry</h3><label>Type <select id="editType"><option>P</option><option>U</option></select></label><label>Number <input type="number" id="editNum" min="1" required></label><label>Time <input id="editTime" required></label><label>Counter <select id="editStation"><option>—</option><option>1</option><option>2</option><option>3</option></select></label><label><input type="checkbox" id="editEstimated"> Estimated time</label><div class="form"><button class="primary">Save</button><button type="button" id="delete">Delete</button><button type="button" id="cancel">Cancel</button></div></form></dialog><script type="module" src="./app.mjs"></script></body></html>
